name: Security CI

on:
  push:
    branches: [main, foundation]
  pull_request:
    branches: [main, foundation]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: packages/innotrepid_security
        run: flutter pub get
      - name: Flutter analyze
        working-directory: packages/innotrepid_security
        run: flutter analyze
      - name: Flutter test
        working-directory: packages/innotrepid_security
        run: flutter test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Typecheck
        working-directory: server
        run: npm run check
      - name: Test
        working-directory: server
        run: npm test

  secure-storage-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/innotrepid_security_secure_storage
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze

  google-play-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/innotrepid_security_google_play
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze

  key-manager-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check key-manager-web/app.js
          node --check key-manager-web/config.js
