name: innotrepid_security
description: Reusable entitlement and integrity client for Innotrepid Flutter applications.
version: 0.6.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1

flutter:
  plugin:
    platforms:
      android:
        package: com.innotrepid.security
        pluginClass: InnotrepidSecurityPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
